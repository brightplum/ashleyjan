---
layout: default
---

<!-- PROJECT -->
<div class="container mt30">
    <div class="col-md-12">

        <!-- IMAGE CAROUSEL -->
         {% if page.slide2 %}
        <div class="owl-slider">
            <img src="{{ page.slide1 }}" alt="">
            <img src="{{ page.slide2 }}" alt="">
            {% if page.slide3 %}<img src="{{ page.slide3 }}" alt="">{% endif %}
        </div>
        {% else %}
        <img src="{{ page.slide1 }}" alt="">
        {% endif %}
        <!-- /IMAGE CAROUSEL -->

        <div class="pt40 mb50">
            <h6 class="title" style="font-size: 1em">{{ page.title }}, {{page.year}}</h6>
            <p>{{ content }}</p>
            <p>{{ page.dimension }}</p>
        </div>

    </div>
</div>
<!-- /PROJECT -->
